server:
  port: 8080

spring:
  application:
    name: z-model-backend
  
  datasource:
    url: jdbc:mysql://localhost:3306/z_model?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
    username: admin
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: localhost
      port: 6379
      password:

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: z-model-secret-key-2026-07-22
  expiration: 7200000
  refresh-expiration: 604800000

logging:
  level:
    com.zmodel: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
